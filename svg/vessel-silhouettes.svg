<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Common vessel type silhouettes">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5dde6"/>
      <stop offset="100%" stop-color="#9ec4d4"/>
    </linearGradient>
    <linearGradient id="hullG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d6a7a"/>
      <stop offset="100%" stop-color="#1e4454"/>
    </linearGradient>
  </defs>
  <rect width="520" height="300" fill="url(#water)"/>
  <line x1="20" y1="210" x2="500" y2="210" stroke="#0e7490" stroke-width="1.5" opacity="0.5"/>

  <!-- Bulk carrier -->
  <g transform="translate(20,0)">
    <path d="M10 210 L25 195 L30 175 L140 175 L155 168 L165 175 L175 195 L190 210 Z" fill="url(#hullG)" stroke="#0a1a2b" stroke-width="1.5"/>
    <!-- cargo hatches -->
    <rect x="45" y="168" width="22" height="7" rx="1" fill="#52697a" stroke="#0a1a2b" stroke-width="0.8"/>
    <rect x="75" y="168" width="22" height="7" rx="1" fill="#52697a" stroke="#0a1a2b" stroke-width="0.8"/>
    <rect x="105" y="168" width="22" height="7" rx="1" fill="#52697a" stroke="#0a1a2b" stroke-width="0.8"/>
    <!-- crane masts -->
    <line x1="56" y1="168" x2="56" y2="148" stroke="#0a1a2b" stroke-width="1.2"/>
    <line x1="86" y1="168" x2="86" y2="148" stroke="#0a1a2b" stroke-width="1.2"/>
    <!-- accommodation aft -->
    <rect x="148" y="152" width="28" height="23" fill="#2a5060" stroke="#0a1a2b" stroke-width="1"/>
    <rect x="152" y="156" width="6" height="5" fill="#a8d8e8" opacity="0.7"/>
    <rect x="162" y="156" width="6" height="5" fill="#a8d8e8" opacity="0.7"/>
  </g>
  <text x="110" y="235" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0a1a2b" text-anchor="middle">Bulk carrier</text>

  <!-- Container ship -->
  <g transform="translate(175,0)">
    <path d="M10 210 L28 192 L35 178 L165 178 L178 172 L188 178 L198 192 L215 210 Z" fill="url(#hullG)" stroke="#0a1a2b" stroke-width="1.5"/>
    <!-- container stacks on deck -->
    <g stroke="#0a1a2b" stroke-width="0.6">
      <rect x="42" y="158" width="14" height="10" fill="#c0392b"/><rect x="42" y="146" width="14" height="10" fill="#1565c0"/>
      <rect x="58" y="158" width="14" height="10" fill="#276221"/><rect x="58" y="146" width="14" height="10" fill="#b45309"/>
      <rect x="74" y="158" width="14" height="10" fill="#0e7490"/><rect x="74" y="146" width="14" height="10" fill="#6a1b9a"/>
      <rect x="90" y="158" width="14" height="10" fill="#1565c0"/><rect x="90" y="146" width="14" height="10" fill="#c0392b"/>
      <rect x="106" y="158" width="14" height="10" fill="#b45309"/><rect x="106" y="146" width="14" height="10" fill="#276221"/>
      <rect x="122" y="158" width="14" height="10" fill="#6a1b9a"/><rect x="122" y="146" width="14" height="10" fill="#0e7490"/>
    </g>
    <!-- bridge island aft -->
    <rect x="155" y="148" width="32" height="30" fill="#2a5060" stroke="#0a1a2b" stroke-width="1"/>
    <rect x="160" y="152" width="8" height="6" fill="#a8d8e8" opacity="0.8"/>
    <rect x="172" y="152" width="8" height="6" fill="#a8d8e8" opacity="0.8"/>
    <polygon points="171,148 179,140 187,148" fill="#2a5060" stroke="#0a1a2b" stroke-width="0.8"/>
    <!-- funnel -->
    <rect x="174" y="134" width="10" height="12" fill="#0a1a2b" rx="1"/>
  </g>
  <text x="285" y="235" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0a1a2b" text-anchor="middle">Container ship</text>

  <!-- Tanker -->
  <g transform="translate(355,0)">
    <path d="M10 210 L22 198 L28 186 L145 186 L158 180 L168 186 L180 198 L195 210 Z" fill="url(#hullG)" stroke="#0a1a2b" stroke-width="1.5"/>
    <!-- continuous deck / pipeline -->
    <line x1="35" y1="186" x2="145" y2="186" stroke="#52697a" stroke-width="2"/>
  <!-- midship accommodation -->
    <rect x="78" y="158" width="36" height="28" fill="#2a5060" stroke="#0a1a2b" stroke-width="1"/>
    <rect x="84" y="163" width="7" height="6" fill="#a8d8e8" opacity="0.7"/>
    <rect x="96" y="163" width="7" height="6" fill="#a8d8e8" opacity="0.7"/>
    <rect x="108" y="163" width="7" height="6" fill="#a8d8e8" opacity="0.7"/>
    <!-- manifold / piping -->
    <line x1="50" y1="186" x2="50" y2="176" stroke="#0a1a2b" stroke-width="1.5"/>
    <circle cx="50" cy="174" r="3" fill="#b45309" stroke="#0a1a2b"/>
    <line x1="130" y1="186" x2="130" y2="176" stroke="#0a1a2b" stroke-width="1.5"/>
    <circle cx="130" cy="174" r="3" fill="#b45309" stroke="#0a1a2b"/>
    <!-- cargo tank division hints -->
    <line x1="55" y1="186" x2="48" y2="210" stroke="#0a1a2b" stroke-width="0.6" opacity="0.35"/>
    <line x1="90" y1="186" x2="90" y2="210" stroke="#0a1a2b" stroke-width="0.6" opacity="0.35"/>
    <line x1="125" y1="186" x2="132" y2="210" stroke="#0a1a2b" stroke-width="0.6" opacity="0.35"/>
  </g>
  <text x="450" y="235" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0a1a2b" text-anchor="middle">Oil / chemical tanker</text>

  <text x="260" y="275" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0a1a2b" text-anchor="middle">Common Merchant Vessel Profiles (side elevation)</text>
</svg>
