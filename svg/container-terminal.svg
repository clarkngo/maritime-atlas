<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-label="Container terminal layout plan view">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef2"/>
      <stop offset="100%" stop-color="#d0dce4"/>
    </linearGradient>
    <linearGradient id="quay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d7d88"/>
      <stop offset="100%" stop-color="#4a5a64"/>
    </linearGradient>
    <linearGradient id="water2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ec4d4"/>
      <stop offset="100%" stop-color="#5aa0b8"/>
    </linearGradient>
  </defs>
  <rect width="520" height="320" fill="url(#ground)"/>

  <!-- water / berth -->
  <rect x="0" y="0" width="520" height="95" fill="url(#water2)"/>
  <line x1="0" y1="95" x2="520" y2="95" stroke="#0a1a2b" stroke-width="2"/>

  <!-- vessel alongside -->
  <path d="M60 95 L75 72 L85 68 L320 68 L335 72 L350 95 Z" fill="#2a4a58" stroke="#0a1a2b" stroke-width="1.5"/>
  <g stroke="#0a1a2b" stroke-width="0.5">
    <rect x="110" y="52" width="12" height="9" fill="#c0392b"/><rect x="124" y="52" width="12" height="9" fill="#1565c0"/>
    <rect x="138" y="52" width="12" height="9" fill="#276221"/><rect x="152" y="52" width="12" height="9" fill="#b45309"/>
    <rect x="166" y="52" width="12" height="9" fill="#0e7490"/><rect x="180" y="52" width="12" height="9" fill="#6a1b9a"/>
    <rect x="194" y="52" width="12" height="9" fill="#1565c0"/><rect x="208" y="52" width="12" height="9" fill="#c0392b"/>
    <rect x="222" y="52" width="12" height="9" fill="#276221"/><rect x="236" y="52" width="12" height="9" fill="#b45309"/>
    <rect x="250" y="52" width="12" height="9" fill="#0e7490"/><rect x="264" y="52" width="12" height="9" fill="#6a1b9a"/>
    <rect x="278" y="52" width="12" height="9" fill="#1565c0"/><rect x="292" y="52" width="12" height="9" fill="#c0392b"/>
  </g>
  <rect x="300" y="74" width="28" height="21" fill="#3a5a68" stroke="#0a1a2b" stroke-width="1"/>
  <text x="205" y="112" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#0a1a2b" text-anchor="middle">Vessel at berth</text>

  <!-- quay apron -->
  <rect x="0" y="95" width="520" height="28" fill="url(#quay)"/>
  <text x="30" y="113" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#fff" font-weight="600">Quay</text>

  <!-- STS crane -->
  <g transform="translate(175, 95)">
    <!-- legs on rails -->
    <rect x="0" y="0" width="520" height="4" fill="#333" opacity="0" />
    <line x1="5" y1="28" x2="95" y2="28" stroke="#333" stroke-width="3"/>
    <rect x="12" y="28" width="8" height="55" fill="#4a4a4a" stroke="#0a1a2b" stroke-width="1"/>
    <rect x="78" y="28" width="8" height="55" fill="#4a4a4a" stroke="#0a1a2b" stroke-width="1"/>
    <!-- boom -->
    <rect x="8" y="22" width="82" height="6" fill="#c0392b" stroke="#0a1a2b" stroke-width="1"/>
    <line x1="45" y1="28" x2="45" y2="8" stroke="#4a4a4a" stroke-width="4"/>
    <line x1="45" y1="8" x2="88" y2="18" stroke="#4a4a4a" stroke-width="3"/>
    <!-- spreader -->
    <line x1="82" y1="18" x2="82" y2="0" stroke="#0a1a2b" stroke-width="1.5"/>
    <rect x="74" y="-2" width="16" height="4" fill="#b45309" stroke="#0a1a2b" stroke-width="0.8"/>
    <text x="50" y="95" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#0d1b26" text-anchor="middle">STS crane</text>
  </g>

  <!-- yard blocks - isometric-ish container stacks -->
  <g transform="translate(50, 155)">
    <!-- block A -->
    <rect x="0" y="0" width="120" height="80" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="60" y="-6" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#0e7490" font-weight="700" text-anchor="middle">Block A</text>
    <g transform="skewX(-15)">
      <rect x="10" y="55" width="18" height="12" fill="#c0392b" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="30" y="55" width="18" height="12" fill="#1565c0" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="50" y="55" width="18" height="12" fill="#276221" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="70" y="55" width="18" height="12" fill="#b45309" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="10" y="40" width="18" height="12" fill="#0e7490" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="30" y="40" width="18" height="12" fill="#6a1b9a" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="50" y="40" width="18" height="12" fill="#1565c0" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="70" y="40" width="18" height="12" fill="#c0392b" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="10" y="25" width="18" height="12" fill="#276221" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="30" y="25" width="18" height="12" fill="#b45309" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="50" y="25" width="18" height="12" fill="#0e7490" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="70" y="25" width="18" height="12" fill="#6a1b9a" stroke="#0a1a2b" stroke-width="0.6"/>
    </g>
  </g>

  <g transform="translate(210, 155)">
    <rect x="0" y="0" width="120" height="80" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="60" y="-6" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#0e7490" font-weight="700" text-anchor="middle">Block B</text>
    <g transform="skewX(-15)">
      <rect x="10" y="55" width="18" height="12" fill="#1565c0" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="30" y="55" width="18" height="12" fill="#276221" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="50" y="55" width="18" height="12" fill="#c0392b" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="70" y="55" width="18" height="12" fill="#0e7490" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="10" y="40" width="18" height="12" fill="#b45309" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="30" y="40" width="18" height="12" fill="#6a1b9a" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="50" y="40" width="18" height="12" fill="#1565c0" stroke="#0a1a2b" stroke-width="0.6"/>
      <rect x="70" y="40" width="18" height="12" fill="#276221" stroke="#0a1a2b" stroke-width="0.6"/>
    </g>
  </g>

  <!-- truck lane -->
  <rect x="380" y="140" width="120" height="100" fill="#ccdce4" stroke="#52697a" stroke-width="1" rx="4"/>
  <rect x="400" y="175" width="50" height="22" rx="3" fill="#1565c0" opacity="0.5" stroke="#0a1a2b" stroke-width="0.8"/>
  <circle cx="410" cy="200" r="5" fill="#333"/><circle cx="440" cy="200" r="5" fill="#333"/>
  <text x="440" y="165" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#0d1b26" font-weight="600" text-anchor="middle">Gate / truck</text>
  <text x="440" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#52697a" text-anchor="middle">lane</text>

  <!-- flow arrows -->
  <path d="M340 200 L370 200" stroke="#0e7490" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#0e7490"/></marker></defs>
  <text x="355" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#0e7490" text-anchor="middle">Transfer</text>

  <text x="260" y="305" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0a1a2b" text-anchor="middle">Container Terminal — Plan View (schematic)</text>
</svg>
