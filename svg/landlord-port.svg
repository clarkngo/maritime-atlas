<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Landlord port model">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef4f7"/>
      <stop offset="100%" stop-color="#dce8ee"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ec8d8"/>
      <stop offset="100%" stop-color="#6aa8bc"/>
    </linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arr-pa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#6a1b9a"/>
    </marker>
    <marker id="arr-op" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#1565c0"/>
    </marker>
    <marker id="arr-sh" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#0e7490"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="url(#bg)"/>

  <!-- Title area -->
  <text x="280" y="28" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="800" fill="#0a1a2b" text-anchor="middle">Landlord Port Model</text>
  <text x="280" y="46" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#52697a" text-anchor="middle">Port authority owns infrastructure and leases terminal sites to private operators</text>

  <!-- ═══ PORT AUTHORITY (landlord) ═══ -->
  <rect x="40" y="58" width="480" height="72" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.5" filter="url(#sh)"/>
  <!-- building icon -->
  <rect x="58" y="76" width="36" height="28" fill="#6a1b9a" opacity="0.25" stroke="#6a1b9a" stroke-width="1.2" rx="2"/>
  <rect x="64" y="82" width="8" height="8" fill="#6a1b9a" opacity="0.5"/>
  <rect x="76" y="82" width="8" height="8" fill="#6a1b9a" opacity="0.5"/>
  <rect x="64" y="94" width="8" height="8" fill="#6a1b9a" opacity="0.5"/>
  <rect x="76" y="94" width="8" height="8" fill="#6a1b9a" opacity="0.5"/>
  <polygon points="76,76 76,68 82,71 88,68 88,76" fill="#6a1b9a" opacity="0.45"/>

  <text x="110" y="88" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="800" fill="#6a1b9a">Port Authority</text>
  <text x="110" y="106" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#0d1b26">Government / public corporation — the <tspan font-weight="700">landlord</tspan></text>
  <text x="110" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#52697a">Owns land &amp; water · Maintains channels, quays, breakwaters, rail/road access · Sets safety &amp; environmental rules</text>

  <!-- owns arrow down -->
  <line x1="280" y1="130" x2="280" y2="148" stroke="#6a1b9a" stroke-width="2" marker-end="url(#arr-pa)"/>
  <text x="292" y="143" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600" fill="#6a1b9a">owns &amp; maintains</text>

  <!-- ═══ PORT INFRASTRUCTURE (owned by PA) ═══ -->
  <rect x="40" y="152" width="480" height="148" rx="10" fill="#f8fafb" stroke="#0a1a2b" stroke-width="2" filter="url(#sh)"/>
  <text x="280" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0a1a2b" text-anchor="middle">Port Infrastructure</text>

  <!-- channel / water -->
  <rect x="56" y="182" width="448" height="36" rx="3" fill="url(#water)"/>
  <text x="72" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#0a1a2b" font-weight="600">Approach channel</text>
  <!-- breakwater hint -->
  <path d="M56 218 L56 210 L90 210 L90 218 Z" fill="#8a9aa4" stroke="#52697a" stroke-width="0.8"/>
  <text x="100" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#52697a">Breakwater</text>

  <!-- quay -->
  <rect x="56" y="218" width="448" height="14" fill="#6d7d88"/>
  <text x="490" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#fff" text-anchor="end">Quay / berth</text>

  <!-- rail spur -->
  <line x1="56" y1="248" x2="120" y2="248" stroke="#52697a" stroke-width="3"/>
  <line x1="70" y1="244" x2="70" y2="252" stroke="#52697a" stroke-width="1"/>
  <line x1="90" y1="244" x2="90" y2="252" stroke="#52697a" stroke-width="1"/>
  <line x1="110" y1="244" x2="110" y2="252" stroke="#52697a" stroke-width="1"/>
  <text x="130" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#52697a">Rail access</text>

  <!-- Leased terminal site (nested) -->
  <rect x="150" y="236" width="300" height="52" rx="6" fill="#e3f0fd" stroke="#1565c0" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="300" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="700" fill="#1565c0" text-anchor="middle">Leased terminal site</text>

  <!-- vessel at berth -->
  <path d="M170 218 L180 200 L230 200 L240 218 Z" fill="#2a4a58" stroke="#0a1a2b" stroke-width="1"/>
  <rect x="195" y="192" width="8" height="6" fill="#c0392b"/><rect x="206" y="192" width="8" height="6" fill="#1565c0"/>
  <rect x="217" y="192" width="8" height="6" fill="#276221"/>

  <!-- STS crane on leased site -->
  <line x1="260" y1="232" x2="260" y2="210" stroke="#4a4a4a" stroke-width="2.5"/>
  <line x1="260" y1="210" x2="290" y2="215" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="275" y="258" width="14" height="10" fill="#c0392b" stroke="#0a1a2b" stroke-width="0.5"/>
  <rect x="293" y="258" width="14" height="10" fill="#1565c0" stroke="#0a1a2b" stroke-width="0.5"/>
  <rect x="311" y="258" width="14" height="10" fill="#276221" stroke="#0a1a2b" stroke-width="0.5"/>
  <rect x="329" y="258" width="14" height="10" fill="#b45309" stroke="#0a1a2b" stroke-width="0.5"/>
  <rect x="347" y="264" width="14" height="10" fill="#0e7490" stroke="#0a1a2b" stroke-width="0.5"/>
  <rect x="365" y="264" width="14" height="10" fill="#6a1b9a" stroke="#0a1a2b" stroke-width="0.5"/>
  <text x="320" y="282" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#52697a" text-anchor="middle">Cranes · yard · buildings (operator investment)</text>

  <!-- lease arrow from PA to terminal site -->
  <path d="M130 130 C130 195 145 230 148 236" fill="none" stroke="#6a1b9a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="108" y="195" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#6a1b9a" font-weight="600" transform="rotate(-55 108 195)">leases site</text>

  <!-- ═══ TERMINAL OPERATOR ═══ -->
  <rect x="40" y="312" width="230" height="52" rx="10" fill="#e3f0fd" stroke="#1565c0" stroke-width="2.5" filter="url(#sh)"/>
  <text x="58" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="800" fill="#1565c0">Terminal Operator</text>
  <text x="58" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#52697a">Private company · Invests in equipment · Runs cargo operations under PA rules</text>

  <!-- operator → leased site -->
  <path d="M200 312 L260 290" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arr-op)"/>
  <text x="218" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600" fill="#1565c0">operates</text>

  <!-- ═══ SHIPPING LINE ═══ -->
  <rect x="290" y="312" width="230" height="52" rx="10" fill="#e0f2f4" stroke="#0e7490" stroke-width="2.5" filter="url(#sh)"/>
  <path d="M308 348 L316 338 L348 338 L354 348 Z" fill="#2a4a58" stroke="#0a1a2b" stroke-width="0.8"/>
  <rect x="324" y="332" width="7" height="5" fill="#c0392b"/><rect x="334" y="332" width="7" height="5" fill="#1565c0"/>
  <text x="368" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0e7490">Shipping Line</text>
  <text x="368" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#52697a">Operates vessel · Pays port dues &amp; terminal fees</text>

  <!-- shipping line → berth -->
  <path d="M380 312 L240 218" fill="none" stroke="#0e7490" stroke-width="1.8" marker-end="url(#arr-sh)"/>
  <text x="310" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600" fill="#0e7490">vessel calls at berth</text>

  <!-- fee arrows (dashed, upward) -->
  <path d="M420 312 L420 295 L470 295 L470 130" fill="none" stroke="#0e7490" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="478" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#0e7490">port dues</text>
  <path d="M400 312 L400 300 L155 300 L155 130" fill="none" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="118" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#1565c0">handling fees</text>

  <text x="280" y="374" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#52697a" text-anchor="middle">Schematic — not a real port layout</text>
</svg>
