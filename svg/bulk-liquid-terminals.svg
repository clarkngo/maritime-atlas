<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Bulk and liquid terminal zones">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ec4d4"/>
      <stop offset="100%" stop-color="#5aa0b8"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a6878"/>
      <stop offset="50%" stop-color="#5a8898"/>
      <stop offset="100%" stop-color="#3a6878"/>
    </linearGradient>
  </defs>
  <rect width="520" height="300" fill="#e8eef2"/>

  <!-- water -->
  <rect x="0" y="0" width="520" height="80" fill="url(#w)"/>
  <line x1="0" y1="80" x2="520" y2="80" stroke="#0a1a2b" stroke-width="2"/>

  <!-- quay -->
  <rect x="0" y="80" width="520" height="22" fill="#6d7d88"/>

  <!-- bulk zone left -->
  <rect x="30" y="110" width="150" height="150" rx="8" fill="#fff3e0" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="105" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Dry Bulk Terminal</text>

  <!-- silos -->
  <ellipse cx="70" cy="200" rx="22" ry="38" fill="#d4a574" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="70" cy="168" rx="22" ry="8" fill="#e8c49a" stroke="#b45309" stroke-width="1"/>
  <ellipse cx="115" cy="200" rx="22" ry="38" fill="#d4a574" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="115" cy="168" rx="22" ry="8" fill="#e8c49a" stroke="#b45309" stroke-width="1"/>
  <ellipse cx="160" cy="200" rx="22" ry="38" fill="#d4a574" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="160" cy="168" rx="22" ry="8" fill="#e8c49a" stroke="#b45309" stroke-width="1"/>
  <!-- conveyor -->
  <rect x="55" y="148" width="110" height="6" fill="#52697a" rx="2"/>
  <text x="105" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#52697a" text-anchor="middle">Silo storage · conveyor to ship loader</text>

  <!-- liquid zone right -->
  <rect x="300" y="110" width="190" height="150" rx="8" fill="#e0f2f4" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="395" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0e7490" text-anchor="middle">Liquid Bulk Terminal</text>

  <!-- storage tanks -->
  <ellipse cx="350" cy="210" rx="28" ry="42" fill="url(#tank)" stroke="#0a1a2b" stroke-width="1.5"/>
  <ellipse cx="350" cy="172" rx="28" ry="10" fill="#6a98a8" stroke="#0a1a2b" stroke-width="1"/>
  <ellipse cx="420" cy="210" rx="28" ry="42" fill="url(#tank)" stroke="#0a1a2b" stroke-width="1.5"/>
  <ellipse cx="420" cy="172" rx="28" ry="10" fill="#6a98a8" stroke="#0a1a2b" stroke-width="1"/>
  <!-- pipeline to jetty -->
  <line x1="350" y1="172" x2="350" y2="102" stroke="#b45309" stroke-width="3"/>
  <line x1="420" y1="172" x2="420" y2="102" stroke="#b45309" stroke-width="3"/>
  <circle cx="350" cy="98" r="5" fill="#c0392b" stroke="#0a1a2b"/>
  <circle cx="420" cy="98" r="5" fill="#c0392b" stroke="#0a1a2b"/>
  <text x="395" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#52697a" text-anchor="middle">Tank farm · pipeline · loading arm at jetty</text>

  <!-- vessel at shared berth -->
  <path d="M180 80 L192 58 L210 55 L310 55 L325 58 L340 80 Z" fill="#2a4a58" stroke="#0a1a2b" stroke-width="1.5"/>
  <text x="260" y="74" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#fff" text-anchor="middle" opacity="0.8">Berth</text>

  <!-- ship loader arm bulk side -->
  <line x1="105" y1="148" x2="195" y2="72" stroke="#52697a" stroke-width="2"/>
  <text x="250" y="285" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0a1a2b" text-anchor="middle">Bulk &amp; Liquid Terminal Zones (schematic)</text>
</svg>
