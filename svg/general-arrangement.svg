<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-label="Simplified general arrangement">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dceaf0"/>
      <stop offset="100%" stop-color="#b5cfd9"/>
    </linearGradient>
    <linearGradient id="hull2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7280"/>
      <stop offset="100%" stop-color="#2a4a58"/>
    </linearGradient>
  </defs>
  <rect width="560" height="280" fill="url(#bg2)"/>
  <line x1="30" y1="195" x2="530" y2="195" stroke="#0e7490" stroke-width="1.5" opacity="0.5"/>

  <!-- hull profile -->
  <path d="M40 195 L55 180 L70 172 L480 172 L495 180 L520 195 L520 200 L40 200 Z"
        fill="url(#hull2)" stroke="#0a1a2b" stroke-width="2"/>

  <!-- zone bands -->
  <rect x="70" y="120" width="90" height="52" fill="#0e7490" opacity="0.15" stroke="#0e7490" stroke-width="1" stroke-dasharray="4"/>
  <rect x="160" y="100" width="220" height="72" fill="#1565c0" opacity="0.12" stroke="#1565c0" stroke-width="1" stroke-dasharray="4"/>
  <rect x="380" y="115" width="60" height="57" fill="#6a1b9a" opacity="0.15" stroke="#6a1b9a" stroke-width="1" stroke-dasharray="4"/>
  <rect x="440" y="125" width="50" height="47" fill="#0e7490" opacity="0.15" stroke="#0e7490" stroke-width="1" stroke-dasharray="4"/>

  <!-- fore castle -->
  <path d="M70 172 L70 155 L95 145 L115 155 L115 172 Z" fill="#3a5a68" stroke="#0a1a2b" stroke-width="1"/>
  <!-- cargo hatches -->
  <rect x="175" y="165" width="35" height="7" rx="1" fill="#52697a" stroke="#0a1a2b" stroke-width="0.8"/>
  <rect x="220" y="165" width="35" height="7" rx="1" fill="#52697a" stroke="#0a1a2b" stroke-width="0.8"/>
  <rect x="265" y="165" width="35" height="7" rx="1" fill="#52697a" stroke="#0a1a2b" stroke-width="0.8"/>
  <rect x="310" y="165" width="35" height="7" rx="1" fill="#52697a" stroke="#0a1a2b" stroke-width="0.8"/>
  <!-- engine room casing -->
  <rect x="385" y="138" width="48" height="34" fill="#3a5a68" stroke="#0a1a2b" stroke-width="1"/>
  <rect x="392" y="144" width="8" height="7" fill="#a8d8e8" opacity="0.7"/>
  <rect x="405" y="144" width="8" height="7" fill="#a8d8e8" opacity="0.7"/>
  <!-- aft accommodation -->
  <rect x="445" y="148" width="38" height="24" fill="#3a5a68" stroke="#0a1a2b" stroke-width="1"/>
  <polygon points="464,148 472,138 480,148" fill="#3a5a68" stroke="#0a1a2b" stroke-width="0.8"/>

  <!-- bulkhead markers -->
  <line x1="160" y1="100" x2="160" y2="200" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="380" y1="100" x2="380" y2="200" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="440" y1="100" x2="440" y2="200" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 3"/>

  <!-- dimension arrows -->
  <line x1="70" y1="215" x2="490" y2="215" stroke="#0d1b26" stroke-width="1"/>
  <polygon points="70,215 78,211 78,219" fill="#0d1b26"/>
  <polygon points="490,215 482,211 482,219" fill="#0d1b26"/>
  <text x="280" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#0d1b26" text-anchor="middle">Length overall (LOA)</text>

  <!-- labels -->
  <text x="115" y="112" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0e7490" text-anchor="middle">Fore</text>
  <text x="115" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#52697a" text-anchor="middle">Bow · windlass</text>
  <text x="270" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1565c0" text-anchor="middle">Cargo holds</text>
  <text x="270" y="106" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#52697a" text-anchor="middle">Hatch covers · tween decks</text>
  <text x="410" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#6a1b9a" text-anchor="middle">Engine room</text>
  <text x="465" y="118" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0e7490" text-anchor="middle">Aft</text>
  <text x="465" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#52697a" text-anchor="middle">Accommodation · steering</text>

  <text x="280" y="265" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0a1a2b" text-anchor="middle">General Arrangement — Profile View (schematic)</text>
</svg>
